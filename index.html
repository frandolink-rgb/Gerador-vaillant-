<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestres AI Studio</title>
    <link rel="stylesheet" href="https://techideia.net">
    <style>
        :root { --accent-color: #ccff00; --bg-dark: #0a0a0a; --panel-bg: #141414; --text-main: #ffffff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; }
        .left-panel { background: var(--panel-bg); width: 100%; max-width: 400px; padding: 20px; overflow-y: auto; border-right: 1px solid #333; }
        .panel-title { color: var(--accent-color); font-size: 1.5rem; text-transform: uppercase; margin: 0; }
        .prompt-input { background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; padding: 12px; width: 100%; height: 80px; margin: 10px 0; }
        .generate-btn { background: var(--accent-color); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }
        .right-panel { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; padding: 20px; text-align: center; }
        #responseText { color: var(--accent-color); font-size: 1.2rem; white-space: pre-wrap; }
    </style>
</head>
<body>
<div style="display: flex; height: 100%;">
    <div class="left-panel">
        <h1 class="panel-title">⚡ Mestres AI Studio</h1>
        <div style="margin: 20px 0;">
            <label>Sua pergunta para a IA (Grátis):</label>
            <textarea id="prompt" class="prompt-input" placeholder="Ex: Olá, você está funcionando?"></textarea>
        </div>
        <button class="generate-btn" id="genBtn" onclick="testAI()">TESTAR CONEXÃO</button>
    </div>
    <div class="right-panel">
        <div id="responseText">Aguardando resposta... ✨</div>
    </div>
</div>

<script>
    async function testAI() {
        const promptText = document.querySelector('#prompt').value;
        const btn = document.querySelector('#genBtn');
        const display = document.querySelector('#responseText');

        if(!promptText) return alert("Digite algo!");

        btn.disabled = true;
        btn.innerText = "PENSANDO...";
        display.innerText = "Conectando com a IA gratuita...";

        try {
            const response = await fetch("https://openrouter.ai", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer sk-or-v1-d42175f431b8a12364d6368e477564e44ad6c3cfd658c148",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "google/gemini-2.0-flash-lite-preview-02-05:free",
                    "messages": [{ "role": "user", "content": promptText }]
                })
            });
            const data = await response.json();
            display.innerText = data.choices[0].message.content;
        } catch (e) {
            display.innerText = "Erro: Sem conexão ou chave inválida.";
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerText = "TESTAR NOVAMENTE";
        }
    }
</script>
</body>
</html>
