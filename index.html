<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Imagens Profissional</title>
    <link rel="stylesheet" href="https://techideia.net">
    <style>
        :root { --accent-color: #ccff00; --bg-dark: #0a0a0a; --panel-bg: #141414; --text-main: #ffffff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; flex-direction: column; }
        .left-panel { background: var(--panel-bg); width: 100%; max-width: 400px; padding: 20px; overflow-y: auto; border-right: 1px solid #333; }
        .panel-title { color: var(--accent-color); font-size: 1.5rem; text-transform: uppercase; margin: 0; }
        .prompt-input { background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; padding: 12px; width: 100%; height: 80px; margin: 10px 0; }
        .generate-btn { background: var(--accent-color); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; }
        .functions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .function-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
        .function-card.active { border-color: var(--accent-color); }
        .right-panel { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
    </style>
</head>
<body>
<div style="display: flex; height: 100%;">
    <div class="left-panel">
        <h1 class="panel-title">⚡ Mestres AI Studio</h1>
        <p style="font-size: 0.8rem; opacity: 0.6;">Gerador Profissional</p>
        
        <div style="margin: 20px 0;">
            <label>Qual a sua ideia:</label>
            <textarea id="prompt" class="prompt-input" placeholder="Ex: Um astronauta em Marte..."></textarea>
        </div>

        <div class="functions-grid">
            <div class="function-card active"><div>🎨</div>Prompt</div>
            <div class="function-card"><div>🏷️</div>Sticker</div>
            <div class="function-card"><div>💎</div>Logo</div>
            <div class="function-card"><div>✍️</div>Desenho</div>
        </div>

        <button class="generate-btn" onclick="alert('Iniciando geração...')">GERAR IMAGEM</button>
    </div>
    <div class="right-panel">
        <div style="opacity: 0.3;">Sua obra aparecerá aqui ✨</div>
    </div>
</div>
</body>
</html>
