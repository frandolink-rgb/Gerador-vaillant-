<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestres AI Studio</title>
    <link rel="stylesheet" href="https://techideia.net">
    <style>
        :root { --accent-color: #ccff00; --bg-dark: #0a0a0a; --panel-bg: #141414; --text-main: #ffffff; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; }
        .left-panel { background: var(--panel-bg); width: 100%; max-width: 400px; padding: 20px; overflow-y: auto; border-right: 1px solid #333; }
        .panel-title { color: var(--accent-color); font-size: 1.5rem; text-transform: uppercase; margin: 0; }
        .prompt-input { background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; padding: 12px; width: 100%; height: 80px; margin: 10px 0; }
        .generate-btn { background: var(--accent-color); color: black; border: none; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }
        .functions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .function-card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
        .function-card.active { border-color: var(--accent-color); }
        .right-panel { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        #outputImage { max-width: 90%; border-radius: 10px; display: none; }
        .loading { display: none; color: var(--accent-color); }
    </style>
</head>
<body>
<div style="display: flex; height: 100%;">
    <div class="left-panel">
        <h1 class="panel-title">⚡ Mestres AI Studio</h1>
        <div style="margin: 20px 0;">
            <label>Qual a sua ideia:</label>
            <textarea id="prompt" class="prompt-input" placeholder="Ex: Um astronauta em Marte..."></textarea>
        </div>
        <div class="functions-grid">
            <div class="function-card active"><div>🎨</div>Prompt</div>
            <div class="function-card"><div>🏷️</div>Sticker</div>
        </div>
        <button class="generate-btn" id="genBtn" onclick="generateImage()">GERAR IMAGEM</button>
    </div>
    <div class="right-panel">
        <div id="loading" class="loading">Gerando sua obra de arte... ⏳</div>
        <img id="outputImage" src="" alt="Imagem Gerada">
    </div>
</div>

<script>
    async function generateImage() {
        const promptText = document.querySelector('#prompt').value;
        const btn = document.querySelector('#genBtn');
        const img = document.querySelector('#outputImage');
        const loader = document.querySelector('#loading');

        if(!promptText) return alert("Digite algo!");

        btn.disabled = true;
        btn.innerText = "GERANDO...";
        loader.style.display = "block";
        img.style.display = "none";

        try {
            const response = await fetch("https://openrouter.ai", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer 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",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "black-forest-labs/flux-schnell",
                    "messages": [{ "role": "user", "content": "Professional 8k photo of: " + promptText }]
                })
            });
            const data = await response.json();
            // Nota: No OpenRouter, alguns modelos retornam o link da imagem no corpo da resposta
            alert("Solicitação enviada! Verifique o console do navegador ou o painel da OpenRouter para ver a imagem gerada.");
        } catch (e) {
            alert("Erro ao conectar com a IA.");
        } finally {
            btn.disabled = false;
            btn.innerText = "GERAR IMAGEM";
            loader.style.display = "none";
        }
    }
</script>
</body>
</html>
