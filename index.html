<!DOCTYPE html>
<html>
<body style="background:#000; color:#ccff00; text-align:center; font-family:sans-serif;">
    <h1>TESTE DE IA</h1>
    <button onclick="falar()" style="padding:20px; background:#ccff00; border:none; font-weight:bold;">CLIQUE PARA TESTAR</button>
    <p id="resp">Aguardando...</p>

    <script>
        async function falar() {
            document.getElementById('resp').innerText = "Chamando IA...";
            try {
                const r = await fetch("https://openrouter.ai", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer sk-or-v1-d42175f431b8a12364d6368e477564e44ad6c3cfd658c148",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.0-flash-lite-preview-02-05:free",
                        "messages": [{"role": "user", "content": "Diga Olá"}]
                    })
                });
                const d = await r.json();
                document.getElementById('resp').innerText = d.choices[0].message.content;
            } catch (e) {
                document.getElementById('resp').innerText = "Erro: " + e;
            }
        }
    </script>
</body>
</html>
